<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>搜剧TV · 线路不可用</title>
<style>
  html,body{margin:0;height:100%;background:#0E0E10;color:#F2F1ED;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;text-align:center}
  .mark{width:96px;height:96px;border-radius:24px;background:#191A1D;
    border:1px solid #2A2B30;display:flex;align-items:center;justify-content:center;
    font-size:48px;color:#FF8A3D;margin-bottom:32px}
  h1{font-size:32px;margin:0 0 16px;font-weight:600}
  p{font-size:22px;line-height:1.8;color:#9A9A9E;margin:0 0 12px;max-width:820px}
  kbd{display:inline-block;padding:2px 12px;border:1px solid #3A3B40;
    border-radius:6px;background:#191A1D;color:#F2F1ED;font-size:20px;margin:0 4px}
  .hint{margin-top:36px;font-size:20px;color:#6E6F74}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">▶</div>
  <h1>暂时连不上搜剧</h1>
  <p>两条线路都没有响应，可能是网络波动或站点域名调整。</p>
  <p>按 <kbd>菜单</kbd> 切换线路重试，按 <kbd>返回</kbd> 退出。</p>
  <div class="hint">日志：adb logcat -d -s SoujuTV</div>
</div>
</body>
</html>
